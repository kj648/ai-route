name: Release

# A v* tag builds the image for linux/amd64 and linux/arm64 from the
# Dockerfile, pushes ghcr.io/<owner>/ai-route:<tag> and :latest, then calls
# the deploy webhook. Run it by hand (Actions → Release → Run workflow) to
# build an existing tag, e.g. one pushed before this workflow existed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.12.0
        required: true
      latest:
        description: Also move :latest to this tag
        type: boolean
        default: true
      deploy:
        description: Call the deploy webhook
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ai-route

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # a manual run builds the tag, not main: the revision label and the
      # webhook's sha must be the tag's commit or the server rejects the deploy
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Resolve release
        id: rel
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          LATEST: ${{ github.event_name == 'push' || inputs.latest }}
        run: |
          sha=$(git rev-parse HEAD)
          tags="$IMAGE:$TAG"
          if [ "$LATEST" = true ]; then tags="$tags,$IMAGE:latest"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "building $TAG at $sha → $tags"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.rel.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.rel.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.rel.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy webhook, shared with ppt-agent: POST {service, tag, sha} signed
      # with HMAC-SHA256(secret, "<timestamp>.<body>"); 202 = accepted.
      - name: Trigger deploy
        if: github.event_name == 'push' || inputs.deploy
        env:
          URL: ${{ secrets.DEPLOY_WEBHOOK_URL || 'https://ppt.intra.starlove.top/hooks/deploy' }}
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          TAG: ${{ steps.rel.outputs.tag }}
          SHA: ${{ steps.rel.outputs.sha }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not a release tag (vX.Y.Z); image pushed, deploy skipped"
            exit 0
          fi
          if [ -z "$SECRET" ]; then
            echo "::error::repository secret DEPLOY_WEBHOOK_SECRET is not set"
            exit 1
          fi
          body=$(printf '{"service":"ai-route","tag":"%s","sha":"%s"}' "$TAG" "$SHA")
          ts=$(date +%s)
          sig=$(printf '%s.%s' "$ts" "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $NF}')
          # no retries: a resent request carries the same signature and is a replay (409)
          status=$(curl -sS -o response.txt -w '%{http_code}' --max-time 30 -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H "X-Deploy-Timestamp: $ts" \
            -H "X-Deploy-Signature: sha256=$sig" \
            --data-raw "$body") || status=000
          echo "deploy webhook: HTTP $status"
          if [ "$status" != 202 ]; then
            case "$status" in
              401) hint="signature or timestamp rejected (check DEPLOY_WEBHOOK_SECRET and the runner clock)" ;;
              409) hint="replayed request" ;;
              400) hint="service or tag rejected" ;;
              000) hint="no response (network error or timeout)" ;;
              *) hint="unexpected status" ;;
            esac
            echo "::error::deploy webhook returned $status: $hint"
            cat response.txt 2>/dev/null && echo || true
            exit 1
          fi
