name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: Console scripts parse
        run: node --check web/i18n.js && node --check web/app.js && node --check web/presets.js
      - name: Console i18n complete
        run: node scripts/check-i18n.mjs
      - name: Docker image builds
        run: docker build -t ai-route:ci .
