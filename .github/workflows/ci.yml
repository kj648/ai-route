name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: Console scripts parse
        run: node --check web/i18n.js && node --check web/app.js && node --check web/presets.js && node --check web/icons.js
      - name: Console i18n complete
        run: node scripts/check-i18n.mjs
      - name: Docker image builds
        run: docker build -t ai-route:ci .

  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg: ['12', '17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: airoute
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test (PostgreSQL ${{ matrix.pg }})
        env:
          AI_ROUTE_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/airoute?sslmode=disable
        run: go test -race ./internal/store/... ./internal/gateway ./internal/admin
