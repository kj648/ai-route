services:
  ai-route:
    build:
      context: .
      # 国内构建：在 .env 里设置这几项，见 .env.example
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GO_IMAGE: ${GO_IMAGE:-golang:1.27-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.22}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
    image: ai-route:latest
    container_name: ai-route
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?请在 .env 中设置 ADMIN_TOKEN}
      # 留空用内置 SQLite（数据在 /data）；使用 PostgreSQL 见 docker-compose.postgres.yml
      DATABASE_URL: ${DATABASE_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      TZ: Asia/Shanghai
      # 需要走代理访问上游时：
      # HTTPS_PROXY: http://host.docker.internal:7890
    volumes:
      - ai-route-data:/data

volumes:
  ai-route-data:
